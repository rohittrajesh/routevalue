[project]
name = "routevalue"
version = "0.1.0"
description = "A route decision engine that compares travel options using personalized generalized cost."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
