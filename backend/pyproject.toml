[project]
name = "routevalue"
version = "2.0.0"
description = "A route decision engine that compares travel options using personalized generalized cost."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "pyshp>=3.1.6",
    "shapely>=2.2.0",
    "sqlalchemy>=2.0,<2.1",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "xlwt>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
