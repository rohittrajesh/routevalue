
name: CI

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: routevalue_local
          POSTGRES_PASSWORD: routevalue_local_only
          POSTGRES_DB: routevalue_m3b4
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U routevalue_local -d routevalue_m3b4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m3b4
      DATABASE_URL_UNPOOLED: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m3b4
      ROUTEVALUE_TEST_DATABASE_URL: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m3b4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Apply PostgreSQL migrations
        run: uv run alembic upgrade head

      - name: Verify migration revision
        run: uv run alembic current

      - name: Check database schema consistency
        run: uv run alembic check

      - name: Create isolated M8 EIA test database
        run: |
          uv run python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["DATABASE_URL"],
              isolation_level="AUTOCOMMIT",
          )

          try:
              with engine.connect() as connection:
                  connection.execute(
                      text("CREATE DATABASE routevalue_m8_eia_test")
                  )

              print("M8 isolated test database created")
          finally:
              engine.dispose()
          PY

      - name: Migrate isolated M8 EIA test database
        env:
          DATABASE_URL: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m8_eia_test
          DATABASE_URL_UNPOOLED: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m8_eia_test
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Verify both isolated test databases
        env:
          M8_TEST_DATABASE_URL: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m8_eia_test
        run: |
          uv run python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          databases = {
              "legacy": (
                  os.environ["ROUTEVALUE_TEST_DATABASE_URL"],
                  "routevalue_m3b4",
              ),
              "M8 EIA": (
                  os.environ["M8_TEST_DATABASE_URL"],
                  "routevalue_m8_eia_test",
              ),
          }

          for label, (database_url, expected_name) in databases.items():
              engine = create_engine(database_url)

              try:
                  with engine.connect() as connection:
                      name = connection.execute(
                          text("SELECT current_database()")
                      ).scalar_one()

                      revision = connection.execute(
                          text(
                              "SELECT version_num "
                              "FROM public.alembic_version"
                          )
                      ).scalar_one()

                  assert name == expected_name
                  assert revision == "a19d6e2c740b"

                  print(f"{label}: database and revision verified")
              finally:
                  engine.dispose()
          PY

      - name: Prepare EIA XLS integration fixtures
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 10 --max-time 90 \
            --output /tmp/routevalue_eia_california.xls \
            "https://www.eia.gov/dnav/pet/xls/PET_PRI_GND_DCUS_SCA_W.xls"

          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 10 --max-time 90 \
            --output /tmp/routevalue_eia_gasoline.xls \
            "https://www.eia.gov/dnav/pet/xls/PET_PRI_GND_DCUS_NUS_W.xls"

          uv run python - <<'PY'
          from pathlib import Path

          signature = b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1"

          paths = (
              Path("/tmp/routevalue_eia_california.xls"),
              Path("/tmp/routevalue_eia_gasoline.xls"),
          )

          for path in paths:
              assert path.is_file(), f"Missing fixture: {path}"
              assert path.read_bytes().startswith(signature), (
                  f"Invalid XLS fixture: {path}"
              )
              print(f"Verified EIA workbook: {path.name}")
          PY

      - name: Run PostgreSQL integration tests
        run: |
          uv run pytest -q \
            tests/test_postgres_integration.py \
            tests/test_postgres_user_identity_repository.py \
            tests/test_api_user_identity_postgres.py \
            tests/test_postgres_user_preferences_repository.py \
            tests/test_api_preferences_postgres.py \
            tests/test_api_preferences_authenticated_postgres.py \
            tests/test_postgres_saved_vehicle_repository.py \
            tests/test_api_saved_vehicles_authenticated_postgres.py

      - name: Run complete backend tests
        env:
          DATABASE_URL_UNPOOLED: postgresql+psycopg://routevalue_local:routevalue_local_only@127.0.0.1:55432/routevalue_m8_eia_test
        run: uv run pytest -q

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run strict mypy
        run: uv run mypy .

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Sync locked backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Check API contract
        run: npm run api:check

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Python for V2 browser API
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv for V2 browser API
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install locked V2 browser API dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

  backend-container:
    name: Backend container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -t routevalue-backend:ci ./backend

      - name: Start backend container
        run: |
          docker run -d \
            --name routevalue-backend-ci \
            -p 8001:8000 \
            routevalue-backend:ci

      - name: Smoke test health endpoint
        run: |
          for attempt in {1..30}; do
            if response="$(curl -fsS http://127.0.0.1:8001/health 2>/dev/null)"; then
              printf '%s\n' "$response"

              if [ "$response" = '{"status":"ok"}' ]; then
                exit 0
              fi

              echo "Unexpected health response."
              docker logs routevalue-backend-ci
              exit 1
            fi

            sleep 1
          done

          echo "Backend container did not become healthy in time."
          docker logs routevalue-backend-ci
          exit 1

      - name: Clean up backend container
        if: always()
        run: docker rm -f routevalue-backend-ci 2>/dev/null || true
